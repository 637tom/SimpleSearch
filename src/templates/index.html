<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Search</title>
    <style>
        body {
            font-family: sans-serif;
            max_width: 800px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .search-container {
            text-align: center;
            margin-bottom: 30px;
        }
        input[type="text"] {
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #results {
            list-style-type: none;
            padding: 0;
        }
        .result-item {
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .result-title {
            font-size: 18px;
            margin-bottom: 5px;
        }
        .result-title a {
            text-decoration: none;
            color: #1a0dab;
        }
        .result-title a:hover {
            text-decoration: underline;
        }
        .result-url {
            color: #006621;
            font-size: 14px;
        }
        .no-results {
            color: #777;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <h1>Simple Search</h1>
        <input type="text" id="searchInput" placeholder="Search...">
        <button onclick="performSearch()">Search</button>
    </div>

    <ul id="results"></ul>

    <script>
        const searchInput = document.getElementById('searchInput');

        // Allow searching by pressing Enter
        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        async function performSearch() {
            const query = searchInput.value;
            if (!query) return;

            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '<li style="text-align:center">Searching...</li>';

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                resultsContainer.innerHTML = '';

                if (data.length === 0) {
                    resultsContainer.innerHTML = '<li class="no-results">No results found</li>';
                    return;
                }

                data.forEach(result => {
                    const li = document.createElement('li');
                    li.className = 'result-item';
                    li.innerHTML = `
                        <div class="result-title"><a href="${result.url}" target="_blank">${result.title}</a></div>
                        <div class="result-url">${result.url}</div>
                    `;
                    resultsContainer.appendChild(li);
                });
            } catch (error) {
                console.error('Error:', error);
                resultsContainer.innerHTML = '<li style="color:red; text-align:center">Error performing search</li>';
            }
        }
    </script>
</body>
</html>
